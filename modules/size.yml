# S2 purpose: size budgets via command-rule plumbing. Aggregates (no native
# sum kind) stay helper-owned; this module holds per-file native limits.
# NO command/spawn kinds here: trust gate allows them only in an
# adopter's own top-level config, never via extends. Adopters add the
# aggregate check (policy-size-check --check) in their own .alint.yml.
# Line accounting is wc -l (trailing newline matters at the boundary).
# fixtures/ and testdata/ are adversarial inputs, not owned code.
version: 1
rules:
  - id: size-file-400
    kind: file_max_lines
    paths:
      include: ["**/*.rs"]
      exclude: ["**/fixtures/**", "**/testdata/**"]
    max_lines: 400
    level: error
    message: "Rust source exceeds 400 lines; split the file (no grandfathering)"

  - id: size-lib-main-150
    kind: file_max_lines
    paths:
      include: ["**/lib.rs", "**/main.rs"]
    max_lines: 150
    level: error
    message: "lib.rs/main.rs MUST stay under 150 lines; move logic into modules"
